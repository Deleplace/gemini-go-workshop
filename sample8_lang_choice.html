<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbidden Word Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md mx-auto text-center">
        <header class="mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-cyan-400">Forbidden Word</h1>
            <p class="text-slate-400 mt-2">Select your language to play!</p>
        </header>

        <main id="language-selection" class="bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8">
            <div class="flex flex-col space-y-4">
                <a href="/en" id="lang-en-button" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg transition-transform transform hover:scale-105">
                    English
                </a>
                <a href="/fr" id="lang-fr-button" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg transition-transform transform hover:scale-105">
                    Français
                </a>
            </div>
        </main>
        
        <footer class="mt-8 text-slate-500">
            <p>This game uses your microphone.</p>
        </footer>
    </div>
</body>
</html>
